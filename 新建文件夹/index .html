logo.png<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef2f9">
<meta name="description" content="个人简历 · 计算机科学与技术 2026 级 · 互联网运营 / 产品 / 数据分析">
<title>个人简历</title>
<style>
  *,*::before,*::after{box-sizing:border-box}

  :root{
    --nav-h:60px;
    --bg:#eef2f9;
    --surface:#ffffff;
    --surface-2:#f4f7fc;
    --text:#0e1729;
    --text-2:#4b5b76;
    --text-3:#8394ae;
    --border:#e2e8f2;
    --primary:#2f6df6;
    --primary-2:#5b8dff;
    --primary-soft:#eaf0ff;
    --accent:#f59e0b;
    --accent-soft:#fff5e2;
    --glow-1:rgba(47,109,246,.13);
    --glow-2:rgba(245,158,11,.13);
    --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 28px -16px rgba(15,23,42,.28);
    --shadow-hover:0 2px 6px rgba(15,23,42,.06),0 22px 44px -22px rgba(15,23,42,.38);
    --radius:16px;
  }

  [data-theme="dark"]{
    --bg:#080d1a;
    --surface:#121a2e;
    --surface-2:#18203a;
    --text:#e9eefb;
    --text-2:#a8b6d1;
    --text-3:#7586a6;
    --border:#243050;
    --primary:#6f9dff;
    --primary-2:#93b7ff;
    --primary-soft:#18233f;
    --accent:#fbbf24;
    --accent-soft:#2a2312;
    --glow-1:rgba(111,157,255,.16);
    --glow-2:rgba(251,191,36,.09);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -16px rgba(0,0,0,.7);
    --shadow-hover:0 2px 6px rgba(0,0,0,.4),0 22px 44px -22px rgba(0,0,0,.85);
  }

  html{
    scroll-behavior:smooth;
    scroll-padding-top:calc(var(--nav-h) + 14px);
    -webkit-text-size-adjust:100%;
  }

  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.72;
    font-size:15px;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    transition:background .25s ease,color .25s ease;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background:
      radial-gradient(900px 520px at 10% -10%,var(--glow-1),transparent 70%),
      radial-gradient(760px 480px at 94% 2%,var(--glow-2),transparent 72%);
  }

  a{color:inherit}
  img,svg{max-width:100%}

  .skip-link{
    position:absolute;left:-9999px;top:0;z-index:999;
    background:var(--primary);color:#fff;padding:10px 16px;border-radius:0 0 10px 0;
    font-size:13px;font-weight:600;text-decoration:none;
  }
  .skip-link:focus{left:0}

  /* ============ 导航 ============ */
  .site-nav{
    position:fixed;
    top:0;left:0;right:0;
    height:var(--nav-h);
    z-index:100;
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    border-bottom:1px solid var(--border);
    transition:box-shadow .25s ease,background .25s ease;
  }
  [data-theme="dark"] .site-nav{background:rgba(9,14,28,.78)}
  .site-nav.scrolled{box-shadow:0 10px 30px -24px rgba(15,23,42,.55)}

  .nav-inner{
    max-width:1140px;
    height:100%;
    margin:0 auto;
    padding:0 18px;
    display:flex;
    align-items:center;
    gap:12px;
  }

  .brand{
    display:flex;align-items:center;gap:9px;
    text-decoration:none;color:var(--text);
    font-weight:700;font-size:15px;letter-spacing:.01em;
    white-space:nowrap;flex:0 0 auto;
  }
  .brand-dot{
    width:11px;height:11px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    box-shadow:0 0 0 4px var(--primary-soft);
  }

  .nav-links{
    display:flex;align-items:center;gap:2px;
    margin-left:auto;
    overflow-x:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .nav-links::-webkit-scrollbar{display:none}

  .nav-link{
    position:relative;
    color:var(--text-2);
    text-decoration:none;
    font-size:13.5px;
    font-weight:600;
    padding:7px 12px;
    border-radius:9px;
    white-space:nowrap;
    transition:color .18s ease,background .18s ease;
  }
  .nav-link:hover{color:var(--text);background:var(--surface-2)}
  .nav-link.active{color:var(--primary);background:var(--primary-soft)}

  .nav-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}

  /* ============ 按钮 ============ */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid transparent;border-radius:10px;
    padding:9px 16px;
    font-size:13.5px;font-weight:600;
    font-family:inherit;
    line-height:1.2;
    cursor:pointer;
    text-decoration:none;
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease,color .18s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(0) scale(.985)}

  .btn-primary{
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff;
    box-shadow:0 8px 20px -10px rgba(47,109,246,.85);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 28px -12px rgba(47,109,246,.95)}

  .btn-ghost{
    background:var(--surface);
    border-color:var(--border);
    color:var(--text-2);
    box-shadow:0 1px 2px rgba(15,23,42,.03);
  }
  .btn-ghost:hover{
    border-color:var(--primary);
    color:var(--primary);
    transform:translateY(-2px);
    box-shadow:0 10px 22px -14px rgba(47,109,246,.7);
  }

  .btn-sm{padding:7px 13px;font-size:12.5px;border-radius:9px}

  .icon-btn{
    width:36px;height:36px;
    display:grid;place-items:center;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-2);
    font-size:15px;
    cursor:pointer;
    transition:transform .18s ease,border-color .18s ease,background .18s ease;
  }
  .icon-btn:hover{transform:translateY(-2px) rotate(-6deg);border-color:var(--primary);background:var(--primary-soft)}

  /* ============ 布局 ============ */
  .sec{
    position:relative;
    z-index:1;
    max-width:1140px;
    margin:0 auto;
    padding:46px 20px;
  }
  #hero{padding-top:calc(var(--nav-h) + 34px);padding-bottom:20px}

  .inner{width:100%}

  .section-title{
    display:flex;align-items:center;gap:12px;
    margin:0 0 8px;
    font-size:22px;
    font-weight:800;
    letter-spacing:-.01em;
  }
  .section-title::before{
    content:"";
    width:5px;height:21px;border-radius:3px;
    background:linear-gradient(180deg,var(--primary),var(--primary-2));
    flex:0 0 auto;
  }
  .section-sub{
    margin:0 0 24px;
    padding-left:17px;
    font-size:13.5px;
    color:var(--text-3);
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow-hover);
    border-color:rgba(47,109,246,.42);
  }

  /* ============ Hero ============ */
  .hero-card{
    position:relative;
    overflow:hidden;
    padding:32px 32px 28px;
    border-radius:22px;
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
  }
  .hero-card::after{
    content:"";
    position:absolute;inset:0;
    pointer-events:none;
    background:
      radial-gradient(560px 240px at 90% -14%,var(--glow-1),transparent 70%),
      radial-gradient(420px 200px at 4% 108%,var(--glow-2),transparent 72%);
  }

  .hero-head{
    position:relative;
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
  }

  /* 头像：图片 + 首字母兜底 */
  .hero-avatar{
    position:relative;
    overflow:hidden;
    width:88px;height:88px;flex:0 0 88px;
    border-radius:22px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff;
    font-size:32px;
    font-weight:800;
    letter-spacing:.02em;
    box-shadow:0 16px 32px -16px rgba(47,109,246,.95);
    isolation:isolate;
  }
  .hero-avatar img{
    position:relative;
    z-index:2;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
    border:0;
  }
  .hero-avatar .avatar-fallback{
    position:absolute;
    inset:0;
    z-index:1;
    display:grid;
    place-items:center;
  }
  .hero-avatar::after{
    content:"";
    position:absolute;inset:0;
    z-index:3;
    pointer-events:none;
    background:linear-gradient(150deg,rgba(255,255,255,.22),transparent 58%);
    opacity:.85;
  }

  .hero-id{min-width:0}

  .hero-name{
    margin:0 0 4px;
    font-size:29px;
    font-weight:800;
    letter-spacing:-.02em;
    line-height:1.25;
  }

  .hero-role{
    margin:0 0 6px;
    font-size:14px;
    font-weight:600;
    color:var(--text-2);
  }

  .hero-target{
    margin:0;
    font-size:13.5px;
    color:var(--text-3);
  }
  .hero-target-label{
    display:inline-block;
    padding:2px 9px;
    margin-right:6px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    background:var(--accent-soft);
  }

  .hero-intro{
    position:relative;
    margin:0 0 20px;
    font-size:14.5px;
    color:var(--text-2);
    line-height:1.85;
    max-width:78ch;
  }

  .hero-badges{
    position:relative;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:22px;
  }

  .badge{
    display:inline-flex;align-items:center;
    padding:5px 12px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:600;
    color:var(--primary);
    background:var(--primary-soft);
    border:1px solid transparent;
    transition:transform .18s ease,border-color .18s ease;
  }
  .badge:hover{transform:translateY(-2px);border-color:rgba(47,109,246,.4)}

  .hero-cta{
    position:relative;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }

  .ico{font-size:14px;line-height:1}

  /* ============ 亮点成果 ============ */
  .hl-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:14px;
  }

  .hl-card{
    position:relative;
    overflow:hidden;
    padding:20px 18px;
    border-radius:var(--radius);
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  }
  .hl-card::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:3px;
    background:linear-gradient(180deg,var(--primary),var(--primary-2));
    opacity:.9;
  }
  .hl-card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow-hover);
    border-color:rgba(47,109,246,.42);
  }

  .hl-value{
    font-size:27px;
    font-weight:800;
    letter-spacing:-.02em;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    line-height:1.2;
  }
  .hl-label{
    margin-top:4px;
    font-size:13.5px;
    font-weight:600;
    color:var(--text);
  }
  .hl-note{
    margin-top:2px;
    font-size:12px;
    color:var(--text-3);
  }

  /* ============ Tabs ============ */
  .tabs{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    width:fit-content;
    max-width:100%;
    padding:5px;
    margin-bottom:22px;
    border-radius:13px;
    background:var(--surface-2);
    border:1px solid var(--border);
  }

  .tab{
    border:0;
    background:transparent;
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    color:var(--text-2);
    padding:8px 17px;
    border-radius:9px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .18s ease,color .18s ease,box-shadow .18s ease;
  }
  .tab:hover{color:var(--text)}
  .tab:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .tab[aria-selected="true"]{
    background:var(--surface);
    color:var(--primary);
    box-shadow:0 2px 10px -5px rgba(15,23,42,.4);
  }

  .panel:focus{outline:none}
  .panel[hidden]{display:none}

  /* ============ 经历 ============ */
  .exp-item{
    position:relative;
    padding:22px 24px;
    margin-bottom:16px;
  }
  .exp-item:last-child{margin-bottom:0}

  .exp-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    flex-wrap:wrap;
  }

  .exp-left{min-width:0}

  .exp-org{
    margin:0 0 3px;
    font-size:16.5px;
    font-weight:750;
    letter-spacing:-.005em;
    line-height:1.4;
  }

  .exp-role{
    display:block;
    font-size:13.5px;
    font-weight:650;
    color:var(--primary);
  }

  .exp-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .exp-time{
    display:inline-block;
    padding:3px 11px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    color:var(--text-3);
    background:var(--surface-2);
    border:1px solid var(--border);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .exp-points{
    margin:12px 0 0;
    padding:0;
    list-style:none;
  }
  .exp-points li{
    position:relative;
    padding-left:19px;
    margin-bottom:8px;
    font-size:14px;
    color:var(--text-2);
    line-height:1.8;
  }
  .exp-points li:last-child{margin-bottom:0}
  .exp-points li::before{
    content:"";
    position:absolute;
    left:4px;
    top:.68em;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--primary);
    opacity:.5;
  }

  /* ============ 项目 ============ */
  .project-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
    gap:16px;
  }

  .project-card{
    display:flex;
    flex-direction:column;
    padding:22px 22px 20px;
  }

  .project-name{
    margin:0 0 8px;
    font-size:16px;
    font-weight:750;
    letter-spacing:-.005em;
    line-height:1.45;
  }

  .project-meta{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  .project-role{
    font-size:13px;
    font-weight:650;
    color:var(--primary);
  }
  .project-time{
    font-size:12px;
    color:var(--text-3);
    font-variant-numeric:tabular-nums;
  }

  .project-stack{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:14px;
  }
  .chip{
    display:inline-flex;
    padding:3px 10px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:650;
    color:var(--text-2);
    background:var(--surface-2);
    border:1px solid var(--border);
  }

  .project-card .exp-points{margin-top:0}

  .project-results{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--border);
  }
  .result-pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:4px 11px;
    border-radius:999px;
    font-size:12px;
    font-weight:650;
    color:var(--accent);
    background:var(--accent-soft);
  }
  .result-pill::before{
    content:"▲";
    font-size:8px;
    transform:translateY(-.5px);
  }

  /* ============ 作品集 ============ */
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
  }

  .gallery-card{
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    padding:0;
    border-radius:var(--radius);
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    cursor:zoom-in;
    font-family:inherit;
    text-align:left;
    color:inherit;
    transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  }
  .gallery-card:hover,
  .gallery-card:focus-visible{
    transform:translateY(-4px);
    box-shadow:var(--shadow-hover);
    border-color:rgba(47,109,246,.45);
    outline:none;
  }
  .gallery-card:focus-visible{box-shadow:0 0 0 3px var(--primary-soft),var(--shadow-hover)}

  .gallery-figure{
    position:relative;
    width:100%;
    aspect-ratio:4 / 3;
    overflow:hidden;
    background:
      linear-gradient(135deg,var(--primary-soft),var(--surface-2));
    display:grid;
    place-items:center;
  }
  .gallery-figure img{
    width:100%;height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
    transition:transform .35s cubic-bezier(.2,.75,.3,1);
  }
  .gallery-card:hover .gallery-figure img{transform:scale(1.045)}

  .gallery-empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding:20px;
    text-align:center;
    color:var(--text-3);
    font-size:12.5px;
    line-height:1.6;
  }
  .gallery-empty .ge-icon{
    font-size:26px;
    opacity:.6;
  }

  .gallery-body{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:16px 18px 18px;
    border-top:1px solid var(--border);
  }

  .gallery-tag{
    align-self:flex-start;
    display:inline-flex;
    padding:3px 10px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--accent);
    background:var(--accent-soft);
  }

  .gallery-title{
    margin:0;
    font-size:15px;
    font-weight:750;
    letter-spacing:-.005em;
    line-height:1.5;
    color:var(--text);
  }

  .gallery-desc{
    margin:0;
    font-size:13px;
    color:var(--text-3);
    line-height:1.7;
  }

  .gallery-zoom-hint{
    position:absolute;
    right:12px;
    bottom:12px;
    z-index:2;
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:5px 11px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:650;
    color:#fff;
    background:rgba(14,23,41,.58);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    opacity:0;
    transform:translateY(6px);
    transition:opacity .2s ease,transform .2s ease;
    pointer-events:none;
  }
  .gallery-card:hover .gallery-zoom-hint,
  .gallery-card:focus-visible .gallery-zoom-hint{
    opacity:1;
    transform:translateY(0);
  }

  /* ============ 图片灯箱 ============ */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:400;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:56px 18px 30px;
    background:rgba(6,10,20,.86);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    opacity:0;
    visibility:hidden;
    transition:opacity .22s ease,visibility .22s ease;
  }
  .lightbox.show{opacity:1;visibility:visible}

  .lightbox img{
    max-width:min(1080px,94vw);
    max-height:74vh;
    width:auto;height:auto;
    border-radius:14px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.85);
    background:#fff;
    object-fit:contain;
  }

  .lb-caption{
    margin:0;
    max-width:min(900px,92vw);
    text-align:center;
    font-size:13.5px;
    font-weight:600;
    color:rgba(255,255,255,.9);
    line-height:1.7;
  }
  .lb-count{
    font-size:12px;
    font-weight:600;
    color:rgba(255,255,255,.55);
    font-variant-numeric:tabular-nums;
  }

  .lb-btn{
    position:absolute;
    display:grid;

    opacity:0;
    visibility:hidden;
    transform:translateY(12px);
    box-shadow:var(--shadow);
    transition:opacity .22s ease,transform .22s ease,visibility .22s ease,border-color .22s ease;
  }

  /* ==================== 工具函数 ==================== */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function isOk(v) {
    if (v === undefined || v === null) return false;
    if (typeof v === "string") {
      var t = v.trim();
      return t !== "" && t !== "【待补】";
    }
    if (Array.isArray(v)) return v.length > 0;
    return true;
  }

  /* 中文 / 空格文件名安全编码，避免个别服务器 404 */
  function fileUrl(name) {
    try { return encodeURI(name); } catch (e) { return name; }
  }

  function iconText(icon, text) {
    var f = document.createDocumentFragment();
    var s = el("span", "ico", icon);
    s.setAttribute("aria-hidden", "true");
    f.appendChild(s);
    f.appendChild(el("span", null, text));
    return f;
  }

  /* ==================== 通用 Tabs ==================== */
  function buildTabs(config, inner) {
    var tablist = el("div", "tabs");
    tablist.setAttribute("role", "tablist");
    tablist.setAttribute("aria-label", config.ariaLabel || "内容分类");

    var panelsWrap = el("div", "panels");
    var tabs = [];
    var panels = [];

    config.groups.forEach(function (group, i) {
      var tab = el("button", "tab", group.label);
      tab.type = "button";
      tab.id = "tab-" + config.key + "-" + group.id;
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-controls", "panel-" + config.key + "-" + group.id);
      tab.setAttribute("aria-selected", i === 0 ? "true" : "false");
      tab.tabIndex = i === 0 ? 0 : -1;
      tablist.appendChild(tab);
      tabs.push(tab);

      var panel = el("div", "panel");
      panel.id = "panel-" + config.key + "-" + group.id;
      panel.setAttribute("role", "tabpanel");
      panel.setAttribute("aria-labelledby", tab.id);
      panel.tabIndex = 0;
      panel.hidden = i !== 0;
      config.render(group.items, panel);
      panelsWrap.appendChild(panel);
      panels.push(panel);
    });

    inner.appendChild(tablist);
    inner.appendChild(panelsWrap);

    function activate(index, focus) {
      tabs.forEach(function (t, j) {
        var on = j === index;
        t.setAttribute("aria-selected", on ? "true" : "false");
        t.tabIndex = on ? 0 : -1;
        panels[j].hidden = !on;
      });
      if (focus) tabs[index].focus();
    }

    tabs.forEach(function (t, i) {
      t.addEventListener("click", function () { activate(i, false); });
      t.addEventListener("keydown", function (e) {
        var next = null;
        if (e.key === "ArrowRight") next = (i + 1) % tabs.length;
        else if (e.key === "ArrowLeft") next = (i - 1 + tabs.length) % tabs.length;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = tabs.length - 1;
        if (next !== null) {
          e.preventDefault();
          activate(next, true);
        }
      });
    });

    activate(0, false);
  }

  /* ==================== 图片灯箱 ==================== */
  var lb = null;          /* 灯箱根节点 */
  var lbImg = null;
  var lbCaption = null;
  var lbCount = null;
  var lbIndex = 0;
  var lbLastFocus = null;

  function buildLightbox() {
    lb = el("div", "lightbox");
    lb.id = "lightbox";
    lb.setAttribute("role", "dialog");
    lb.setAttribute("aria-modal", "true");
    lb.setAttribute("aria-label", "作品图片预览");

    lbImg = el("img");
    lbImg.alt = "";

    lbCaption = el("p", "lb-caption");
    lbCount = el("p", "lb-count");

    var closeBtn = el("button", "lb-btn lb-close", "✕");
    closeBtn.type = "button";
    closeBtn.setAttribute("aria-label", "关闭预览");

    var prevBtn = el("button", "lb-btn lb-prev", "‹");
    prevBtn.type = "button";
    prevBtn.setAttribute("aria-label", "上一张");

    var nextBtn = el("button", "lb-btn lb-next", "›");
    nextBtn.type = "button";
    nextBtn.setAttribute("aria-label", "下一张");

    lb.appendChild(closeBtn);
    if (galleryItems.length > 1) {
      lb.appendChild(prevBtn);
      lb.appendChild(nextBtn);
    }
    lb.appendChild(lbImg);
    lb.appendChild(lbCaption);
    lb.appendChild(lbCount);

    closeBtn.addEventListener("click", closeLightbox);
    prevBtn.addEventListener("click", function (e) { e.stopPropagation(); stepLightbox(-1); });
    nextBtn.addEventListener("click", function (e) { e.stopPropagation(); stepLightbox(1); });

    /* 点击背景关闭（点击图片与文字不关闭） */
    lb.addEventListener("click", function (e) {
      if (e.target === lb) closeLightbox();
    });

    document.body.appendChild(lb);
  }

  function paintLightbox() {
    var it = galleryItems[lbIndex];
    if (!it) return;
    lbImg.src = fileUrl(it.src);
    lbImg.alt = it.title || "作品图片";
    lbCaption.textContent = [it.title, it.desc].filter(isOk).join(" · ");
    lbCount.textContent = (lbIndex + 1) + " / " + galleryItems.length;
  }

  function stepLightbox(delta) {
    if (galleryItems.length < 2) return;
    lbIndex = (lbIndex + delta + galleryItems.length) % galleryItems.length;
    paintLightbox();
  }

  function openLightbox(index) {
    if (!lb) buildLightbox();
    lbLastFocus = document.activeElement;
    lbIndex = index || 0;
    paintLightbox();
    lb.classList.add("show");
    document.body.style.overflow = "hidden";
    var closeBtn = $(".lb-close", lb);
    if (closeBtn) closeBtn.focus();
  }

  function closeLightbox() {
    if (!lb) return;
    lb.classList.remove("show");
    document.body.style.overflow = "";
    if (lbLastFocus && typeof lbLastFocus.focus === "function") lbLastFocus.focus();
  }

  function isLightboxOpen() {
    return !!lb && lb.classList.contains("show");
  }

  function setupLightboxKeys() {
    document.addEventListener("keydown", function (e) {
      if (!isLightboxOpen()) return;
      if (e.key === "Escape") { e.preventDefault(); closeLightbox(); }
      else if (e.key === "ArrowRight") { e.preventDefault(); stepLightbox(1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); stepLightbox(-1); }
    });
  }

      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "-1000px";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        document.execCommand("copy");
        document.body.removeChild(ta);
        done();
      } catch (e) {
        showToast("复制失败，请手动选择");
      }
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }
  }

  /* ==================== Toast ==================== */
  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById("toast");
    if (!t) {
      t = el("div", "toast");
      t.id = "toast";
      t.setAttribute("role", "status");
      t.setAttribute("aria-live", "polite");
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1900);
  }

  /* ==================== 主题 ==================== */
  function setupTheme() {
    var root = document.documentElement;
    var btn = document.getElementById("themeToggle");
    var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

    var saved = null;
    try { saved = localStorage.getItem("resume-theme"); } catch (e) { saved = null; }

    function apply(theme) {
      root.setAttribute("data-theme", theme);
      btn.textContent = theme === "dark" ? "☀️" : "🌙";
      var label = theme === "dark" ? "切换到浅色模式" : "切换到深色模式";
      btn.setAttribute("aria-label", label);
      btn.setAttribute("title", label);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#080d1a" : "#eef2f9");
    }

    apply(saved || (media && media.matches ? "dark" : "light"));

    btn.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      apply(next);
      try { localStorage.setItem("resume-theme", next); } catch (e) {}
    });

    if (media && media.addEventListener) {
      media.addEventListener("change", function (e) {
        var stored = null;
        try { stored = localStorage.getItem("resume-theme"); } catch (err) { stored = null; }
        if (!stored) apply(e.matches ? "dark" : "light");
      });
    }
  }

  /* ==================== 导航 / 滚动 ==================== */
  function setupNav() {
    var nav = document.getElementById("siteNav");
    var toTop = document.getElementById("toTop");
    var links = $$(".nav-link");

    function onScroll() {
      var y = window.pageYOffset || document.documentElement.scrollTop;
      nav.classList.toggle("scrolled", y > 8);
      toTop.classList.toggle("show", y > 480);
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();

    toTop.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    var sections = $$("main section[id]");

    if ("IntersectionObserver" in window) {
      var spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          var id = en.target.id;
          links.forEach(function (a) {
            a.classList.toggle("active", a.getAttribute("href") === "#" + id);
          });
        });
      }, { rootMargin: "-46% 0px -50% 0px", threshold: 0 });

      sections.forEach(function (s) { spy.observe(s); });
    }

    links.forEach(function (a) {
      a.addEventListener("click", function () {
        links.forEach(function (x) { x.classList.remove("active"); });
        a.classList.add("active");
      });
    });
  }

  /* ==================== 打印 ==================== */
  function setupPrint() {
    var btn = document.getElementById("printBtn");
    btn.addEventListener("click", function () {
      /* 打印前把懒加载图片全部唤醒，避免 PDF 缺图 */
      $$(".gallery-figure img").forEach(function (img) {
        img.loading = "eager";
      });
      window.print();
    });

    window.addEventListener("beforeprint", function () {
      $$(".gallery-figure img").forEach(function (img) {
        img.loading = "eager";
      });
    });
  }

  /* ==================== 进入动效 ==================== */
  function setupReveal() {
    var nodes = $$(".reveal");
    var bars = $$(".bar > i");

    function fillBars() {
      bars.forEach(function (b) { b.classList.add("in"); });
    }

    if (!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      nodes.forEach(function (n) { n.classList.add("in"); });
      fillBars();
      return;
    }

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          en.target.classList.add("in");
          io.unobserve(en.target);
        }
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -8% 0px" });

    nodes.forEach(function (n, i) {
      n.style.transitionDelay = Math.min(i * 40, 160) + "ms";
      io.observe(n);
    });

    var barIo = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          en.target.classList.add("in");
          barIo.unobserve(en.target);
        }
      });
    }, { threshold: 0.2 });

    bars.forEach(function (b) { barIo.observe(b); });

    window.addEventListener("beforeprint", fillBars);
  }

  /* ==================== 初始化 ==================== */
  function init() {
    renderHero();
    renderHighlights();
    renderExperience();
    renderProjects();
    renderGallery();
    renderSkills();
    renderEducation();

    setupTheme();
    setupNav();
    setupPrint();
    setupLightboxKeys();
    setupReveal();

    var y = document.getElementById("year");
    var u = document.getElementById("updated");
    var d = new Date();
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    if (y) y.textContent = d.getFullYear();
    if (u) u.textContent = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
